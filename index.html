<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c0d0d">
<meta name="description" content="ILLUMINATI — an independent philosophical circle devoted to knowledge, wisdom and the illumination of the mind. Lux intus, lux mundi.">
<meta property="og:type" content="website">
<meta property="og:title" content="ILLUMINATI — Lux intus, lux mundi">
<meta property="og:description" content="An independent philosophical circle. Knowledge. Discernment. Inner light.">
<meta property="og:url" content="https://illuminati.cv/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<title>ILLUMINATI — Lux intus, lux mundi</title>
<style>
:root{color-scheme:dark;--coal:#0c0d0d;--paper:#ece7db;--ivory:#efeae0;--mist:#aca69d;--brass:#a8967a;--ex:0px;--ey:0px}
*,*::before,*::after{box-sizing:border-box}
html{min-width:320px}
body{margin:0;background:var(--coal);color:var(--ivory);font-family:"Manrope",Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
::selection{background:#a59b8a;color:#101110}
button{font:inherit}
.site{position:relative;min-height:100svh;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;background:#0c0d0d}
.site:before{content:"";pointer-events:none;position:absolute;inset:-15%;z-index:-3;background:radial-gradient(ellipse 36% 38% at 49% 48%,rgba(110,106,98,.13),transparent 85%),radial-gradient(ellipse 55% 64% at 50% 55%,rgba(35,38,40,.5),transparent 80%),linear-gradient(130deg,#131516 0%,#0c0d0d 49%,#121312 100%)}
.site:after{content:"";pointer-events:none;position:absolute;inset:0;z-index:10;opacity:.15;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E")}
.ambient{position:absolute;pointer-events:none;z-index:-2;left:50%;top:44%;width:min(950px,95vw);height:660px;transform:translate(-50%,-50%) translate3d(calc(var(--ex)*-.34),calc(var(--ey)*-.34),0);background:radial-gradient(ellipse,rgba(204,197,180,.095),rgba(99,103,105,.035) 37%,transparent 73%);filter:blur(25px);transition:transform .2s}
.architecture{position:absolute;z-index:-2;inset:0;pointer-events:none;opacity:.5;background:linear-gradient(90deg,rgba(0,0,0,.45),transparent 14%,transparent 86%,rgba(0,0,0,.5)),linear-gradient(90deg,transparent 21.5%,rgba(211,208,198,.026) 21.65%,transparent 22%,transparent 78%,rgba(211,208,198,.025) 78.15%,transparent 78.3%);box-shadow:inset 0 0 200px rgba(0,0,0,.72)}
.header{position:relative;z-index:5;width:100%;max-width:1650px;margin:0 auto;padding:37px clamp(28px,6vw,96px) 0;display:flex;align-items:center;justify-content:space-between;gap:25px}
.brand{font-size:11px;letter-spacing:.35em;font-weight:600;color:#dedbd3;text-decoration:none}
.header-note{color:#969188;font-size:9px;letter-spacing:.24em;text-transform:uppercase}
.header-note:before{content:"";display:inline-block;width:27px;height:1px;background:#777169;vertical-align:middle;margin-right:15px;opacity:.65}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:1500px;margin:auto;padding:40px clamp(20px,4.8vw,70px) 40px;position:relative;z-index:2}
.intro{text-align:center;margin-top:4px}
.kicker{font-size:10px;letter-spacing:.45em;text-transform:uppercase;color:#a89e90;font-weight:500;margin:0 0 12px}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:clamp(76px,10vw,146px);letter-spacing:.13em;padding-left:.13em;line-height:.87;color:#eeeae2;margin:0;text-shadow:0 5px 48px rgba(0,0,0,.28)}
.under-title{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:clamp(25px,2.8vw,36px);line-height:1;color:#c9c0af;letter-spacing:.035em;margin:18px 0 0}
.gallery{position:relative;width:min(900px,100%);height:395px;margin:30px auto 0;display:flex;align-items:center;justify-content:center;perspective:1000px}
.gallery:before{content:"";position:absolute;z-index:-1;left:12%;right:11%;bottom:0;height:80px;pointer-events:none;background:radial-gradient(ellipse,rgba(0,0,0,.8),transparent 72%);filter:blur(22px)}
.gallery:after{content:"";position:absolute;z-index:-2;left:10%;right:10%;top:8%;bottom:9%;background:radial-gradient(ellipse at 48% 52%,rgba(192,182,164,.11),transparent 67%);filter:blur(25px)}
.exhibit{margin:0;position:relative;display:block;flex:0 0 auto;will-change:transform;animation:arrive 1.2s both cubic-bezier(.21,.7,.14,1);transform-style:preserve-3d}
.exhibit img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none}
.exhibit-owl{width:340px;padding:17px;background:linear-gradient(160deg,#f6f2e9,#e5dfd2);border:1px solid #c3bcb0;box-shadow:0 6px 0 rgba(240,236,224,.06),0 26px 75px rgba(0,0,0,.68),0 0 90px rgba(215,203,178,.055);margin-left:-165px;z-index:3;transform:rotate(-2deg) translate3d(calc(var(--ex)*-.52),calc(var(--ey)*-.45),32px)}
.exhibit-owl img{background:#fff;aspect-ratio:450/455;object-fit:contain;filter:none}
.exhibit-owl:before{content:"";position:absolute;inset:-7px;border:1px solid rgba(221,211,193,.14);pointer-events:none}
.exhibit-eye{position:absolute;width:205px;padding:9px;background:#cac09e;border:1px solid #a59e87;z-index:2;right:7%;top:16%;transform:rotate(4deg) translate3d(calc(var(--ex)*.27),calc(var(--ey)*.36),-60px);box-shadow:0 18px 58px rgba(0,0,0,.69),0 0 0 7px rgba(237,234,222,.018);animation-delay:.12s}
.exhibit-eye img{aspect-ratio:525/600;object-fit:cover;filter:none}
.exhibit-eye:after{content:"";position:absolute;inset:-14px;border:1px solid rgba(203,196,178,.08);pointer-events:none}
.exhibit-meta{position:absolute;left:-138px;bottom:5px;width:130px;text-align:right}
.exhibit-meta strong,.exhibit-meta small{display:block;text-transform:uppercase;font-weight:500}
.exhibit-meta strong{font-size:9px;letter-spacing:.23em;color:#beb3a3}
.exhibit-meta small{font-size:8px;line-height:1.7;letter-spacing:.08em;color:#6f6b63;margin-top:8px}
.eye-meta{position:absolute;top:calc(100% + 20px);left:0;right:0;text-align:center;font-size:8px;text-transform:uppercase;letter-spacing:.2em;color:#868177;white-space:nowrap}
.closing{text-align:center;max-width:630px;margin:17px auto 0}
.closing p{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(18px,1.8vw,23px);line-height:1.32;letter-spacing:.025em;font-weight:400;color:#aaa49a;margin:0 auto 22px}
.mail{display:inline-block;position:relative;padding:0 3px 7px;text-decoration:none;font-size:12px;letter-spacing:.14em;font-weight:500;color:#e8e0d2;border-bottom:1px solid rgba(232,224,210,.43);transition:color .25s,border-color .25s}
.mail:hover{color:white;border-color:white}
.mail:focus-visible{outline:2px solid #e9dcc0;outline-offset:6px}
.footer{position:relative;z-index:3;width:100%;max-width:1650px;margin:0 auto;padding:0 clamp(28px,6vw,96px) 30px;display:flex;justify-content:space-between;align-items:center;gap:20px;color:#75716a;font-size:9px;letter-spacing:.2em;text-transform:uppercase}
.footer em{font-family:"Cormorant Garamond",Georgia,serif;font-size:16px;letter-spacing:.065em;font-weight:400;text-transform:none;color:#9c9489}
@keyframes arrive{from{opacity:0;filter:blur(5px)}to{opacity:1;filter:blur(0)}}
@media(hover:hover) and (pointer:fine){.exhibit-owl:hover{box-shadow:0 6px 0 rgba(240,236,224,.06),0 36px 100px rgba(0,0,0,.75),0 0 100px rgba(215,203,178,.10)}}
@media(min-width:1400px){main{padding-top:37px;padding-bottom:39px}.gallery{height:410px}.exhibit-owl{width:356px}.exhibit-eye{width:215px}}
@media(max-width:950px){.gallery{width:750px;max-width:100%;height:395px}.exhibit-owl{width:310px;margin-left:-100px}.exhibit-eye{width:185px;right:2%;top:18%}.exhibit-meta{left:-117px;width:110px}}
@media(max-width:700px){.header{padding:29px 28px 0}.header-note{display:none}main{padding:51px 20px 45px}.kicker{font-size:9px;letter-spacing:.28em}h1{font-size:clamp(50px,12vw,83px);letter-spacing:.055em;padding-left:.055em}.under-title{font-size:28px;margin-top:15px}.gallery{height:530px;width:min(440px,100%);margin-top:18px;display:block}.exhibit-owl{width:min(68vw,295px);position:absolute;left:3%;top:14px;margin:0;padding:11px;transform:rotate(-2deg) translate3d(calc(var(--ex)*-.25),calc(var(--ey)*-.25),0)}.exhibit-eye{width:min(35vw,145px);right:0;top:auto;bottom:18px;padding:6px;transform:rotate(4deg) translate3d(calc(var(--ex)*.2),calc(var(--ey)*.2),0)}.exhibit-meta{position:absolute;bottom:-38px;left:1px;width:auto;text-align:left}.exhibit-meta strong{font-size:8px}.exhibit-meta small{display:none}.eye-meta{font-size:7px;top:calc(100% + 15px)}.closing{margin:16px auto 0;max-width:350px}.closing p{font-size:21px}.footer{padding:0 28px 27px}.footer span:last-child{display:none}}
@media(max-width:460px){main{padding:45px 18px 36px}h1{font-size:clamp(45px,11.6vw,59px)}.under-title{font-size:26px}.gallery{height:510px;margin-top:23px}.exhibit-owl{width:min(70vw,275px);left:1%}.exhibit-eye{width:min(36vw,139px);right:-1%;bottom:16px}.closing{margin-top:13px}.closing p{font-size:19px;margin-bottom:20px}.footer{font-size:8px}.footer em{font-size:14px}}
@media(max-width:360px){h1{font-size:42px}.gallery{height:475px}.exhibit-owl{width:230px}.exhibit-eye{width:114px}.closing{margin-top:24px}.footer em{display:none}}
@media(max-height:740px) and (min-width:701px){.header{padding-top:24px}main{padding:15px 30px}.gallery{height:325px;margin-top:14px}.exhibit-owl{width:280px}.exhibit-eye{width:170px}.closing{margin-top:12px}.closing p{margin-bottom:14px}.footer{padding-bottom:21px}}
@media(prefers-reduced-motion:reduce){.exhibit{animation:none;will-change:auto}.ambient,.mail{transition:none}.exhibit-owl{transform:rotate(-2deg)}.exhibit-eye{transform:rotate(4deg)}}
</style>
</head>
<body>
<div class="site" id="site">
<div class="architecture" aria-hidden="true"></div><div class="ambient" aria-hidden="true"></div>
<header class="header"><a class="brand" href="/" aria-label="ILLUMINATI, homepage">ILLUMINATI</a><span class="header-note">A private philosophical circle</span></header>
<main>
<div class="intro"><p class="kicker">The pursuit of wisdom</p><h1>ILLUMINATI</h1><p class="under-title">Lux intus, lux mundi</p></div>
<div class="gallery" aria-label="Two independent historical symbols">
<figure class="exhibit exhibit-owl">
<img src="/assets/minerval-1788.png" width="450" height="455" alt="Historical 1788 Minerval emblem: the owl of Minerva perched on an open book inside a wreath, reproduced from a period engraving" fetchpriority="high">
<figcaption class="exhibit-meta"><strong>Minerva</strong><small>Engraving<br>c. 1788</small></figcaption>
</figure>
<figure class="exhibit exhibit-eye">
<img src="/assets/eye-dollar-engraving.jpg" width="525" height="600" alt="Eye of Providence in a triangle, in the original engraved style of the United States dollar bill">
<figcaption class="eye-meta">The eye of providence</figcaption>
</figure>
</div>
<div class="closing"><p>An independent circle devoted to knowledge, discernment, and the illumination of the mind.</p><a href="mailto:contact@illuminati.cv" class="mail">contact@illuminati.cv</a></div>
</main>
<footer class="footer"><span>Knowledge · Discernment · Inner light</span><em>Sapientia in silentio</em><span>Illuminati © 2026</span></footer>
</div>
<script>
(function(){
const root=document.getElementById('site');
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
const fine=matchMedia('(hover:hover) and (pointer:fine)');
if(!root||reduce.matches||!fine.matches)return;
let x=0,y=0,tx=0,ty=0,raf=0;
function run(){x+=(tx-x)*.07;y+=(ty-y)*.07;root.style.setProperty('--ex',x.toFixed(2)+'px');root.style.setProperty('--ey',y.toFixed(2)+'px');if(Math.abs(tx-x)+Math.abs(ty-y)>.15)raf=requestAnimationFrame(run);else raf=0;}
root.addEventListener('pointermove',e=>{tx=(e.clientX/innerWidth-.5)*14;ty=(e.clientY/innerHeight-.5)*12;if(!raf)raf=requestAnimationFrame(run)},{passive:true});
root.addEventListener('pointerleave',()=>{tx=0;ty=0;if(!raf)raf=requestAnimationFrame(run)});
})();
</script>
</body>
</html>
